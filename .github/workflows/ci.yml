name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 25432:5432
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Create the four databases
        run: |
          psql -h localhost -p 25432 -U postgres -c "CREATE DATABASE fueling"
          psql -h localhost -p 25432 -U postgres -c "CREATE DATABASE gas_station"
          psql -h localhost -p 25432 -U postgres -c "CREATE DATABASE payment"
          psql -h localhost -p 25432 -U postgres -c "CREATE DATABASE vendors"

      - name: Apply schema
        run: psql -h localhost -p 25432 -U postgres -v ON_ERROR_STOP=1 -f docs/schema.sql

      - name: Apply seed twice (idempotency, D-12)
        run: |
          psql -h localhost -p 25432 -U postgres -v ON_ERROR_STOP=1 -f docs/seed.sql
          psql -h localhost -p 25432 -U postgres -v ON_ERROR_STOP=1 -f docs/seed.sql

      - name: Build, test and lint
        run: ./gradlew build detekt ktlintCheck
