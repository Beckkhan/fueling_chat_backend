build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

style:
  MagicNumber:
    active: false
  # Scaffold convention (dual-coder pipeline): TODO comments are the handoff contract
  # between architect and implementer. FIXME/STOPSHIP stay forbidden.
  ForbiddenComment:
    allowedPatterns: 'TODO:'

naming:
  ConstructorParameterNaming:
    excludes: ['**/GetFuelingInfoArgs.kt']
