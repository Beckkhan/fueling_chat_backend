build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 120
  WildcardImport:
    active: true

complexity:
  LongMethod:
    threshold: 40
  LongParameterList:
    functionThreshold: 5
  TooManyFunctions:
    thresholdInClasses: 15
  NestedBlockDepth:
    threshold: 3

naming:
  ConstructorParameterNaming:
    excludes: ['**/GetFuelingInfoArgs.kt']
